<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 66" role="img" aria-label="eduryx — Learn AI. Build the Future.">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;display=swap');
    </style>
  </defs>

  <!-- "edury" — white text for dark backgrounds -->
  <text x="0" y="60"
        font-family="'Plus Jakarta Sans', ui-sans-serif, sans-serif"
        font-weight="800"
        font-size="56"
        letter-spacing="-1"
        fill="#FFFFFF">edury</text>

  <!-- x left stroke: white diagonal -->
  <line x1="187" y1="14" x2="225" y2="60"
        stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>

  <!-- x right lower half: white, bottom-left to crossing -->
  <line x1="189" y1="60" x2="206" y2="37"
        stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>

  <!-- arrow shaft: amber -->
  <line x1="206" y1="37" x2="222" y2="13"
        stroke="#F5A623" stroke-width="7" stroke-linecap="round"/>

  <!-- arrowhead: amber -->
  <polygon points="230,5 226,19 218,12" fill="#F5A623"/>
</svg>
