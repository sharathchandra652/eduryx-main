<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>EDURYX — Border Radii</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  .wrap { padding: 28px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .box { width: 80px; height: 80px; background: #0B1929; }
  .amber { background: rgba(245,166,35,0.15); border: 2px solid #F5A623; }
  .meta { font-family: Inter; font-size: 11px; color: #6B7280; }
  .token { font-family: Inter; font-size: 12px; font-weight: 600; color: #0B1929; }
</style>
</head>
<body>
<div class="wrap">
  <div class="item">
    <div class="box amber" style="border-radius:0;"></div>
    <div class="token">0 (none)</div>
    <div class="meta">Dividers, table cells</div>
  </div>
  <div class="item">
    <div class="box amber" style="border-radius:4px;"></div>
    <div class="token">--radius-sm · 4px</div>
    <div class="meta">Chips, badges, small tags</div>
  </div>
  <div class="item">
    <div class="box" style="border-radius:8px;"></div>
    <div class="token">--radius-md · 8px</div>
    <div class="meta">Buttons, inputs</div>
  </div>
  <div class="item">
    <div class="box" style="border-radius:12px;"></div>
    <div class="token">--radius-lg · 12px</div>
    <div class="meta">Cards (default)</div>
  </div>
  <div class="item">
    <div class="box" style="border-radius:16px;"></div>
    <div class="token">--radius-xl · 16px</div>
    <div class="meta">Hero panels, modals</div>
  </div>

  <!-- Pill row -->
  <div style="grid-column:1/-1;display:flex;gap:12px;align-items:center;padding-top:16px;border-top:1px solid #EEF0F3;">
    <div style="width:100px;height:36px;background:#0B1929;border-radius:999px;"></div>
    <div>
      <div class="token">--radius-pill · 999px</div>
      <div class="meta">Tags, pills, badge counts, toggle tracks</div>
    </div>
  </div>
</div>
</body>
</html>
