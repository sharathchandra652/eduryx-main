<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>EDURYX — Neutral Colors</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  .wrap { padding: 28px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .swatch { border-radius: 8px; overflow: hidden; border: 1px solid #EEF0F3; }
  .chip { height: 80px; }
  .info { padding: 10px 12px; }
  .name { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 13px; color: #0B1929; }
  .hex  { font-family: Inter; font-size: 11px; color: #6B7280; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <div class="swatch">
    <div class="chip" style="background:#FFFFFF; border-bottom:1px solid #EEF0F3;"></div>
    <div class="info"><div class="name">White</div><div class="hex">#FFFFFF</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#F7F8FA;"></div>
    <div class="info"><div class="name">Grey 50</div><div class="hex">#F7F8FA</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#EEF0F3;"></div>
    <div class="info"><div class="name">Grey 100</div><div class="hex">#EEF0F3</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#D8DCE2;"></div>
    <div class="info"><div class="name">Grey 200</div><div class="hex">#D8DCE2</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#6B7280;"></div>
    <div class="info"><div class="name">Grey</div><div class="hex">#6B7280</div></div>
  </div>
</div>
</body>
</html>
